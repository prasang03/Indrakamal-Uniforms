<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- Brand Color Palette from Official Indrakamal Emblem -->
    <style>
      .navy-petal { fill: #004d7a; }
      .bright-petal { fill: #0d82c5; }
    </style>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. TOP CENTRAL FLAME PETAL (Navy Blue #004d7a)               -->
  <!-- ============================================================ -->
  <path
    class="navy-petal"
    d="M 500 70
       C 468 135, 386 218, 338 286
       C 358 335, 386 385, 410 422
       C 436 348, 472 284, 500 236
       C 528 284, 564 348, 590 422
       C 614 385, 642 335, 662 286
       C 614 218, 532 135, 500 70 Z"
  />

  <!-- ============================================================ -->
  <!-- 2. LEFT HALF PETALS (Mirrored with Right Half)               -->
  <!-- ============================================================ -->
  <g id="left-petals">
    <!-- Middle-Top Wing Petal (Bright Blue #0d82c5) -->
    <path
      class="bright-petal"
      d="M 164 252
         C 152 330, 156 414, 172 472
         C 190 488, 230 506, 274 522
         C 264 456, 278 376, 320 318
         C 268 274, 212 256, 164 252 Z"
    />

    <!-- Inner Central Upright Petal (Bright Blue #0d82c5) -->
    <path
      class="bright-petal"
      d="M 408 238
         C 346 338, 280 448, 276 524
         C 334 602, 420 672, 486 714
         C 486 648, 484 534, 464 438
         C 446 354, 424 290, 408 238 Z"
    />

    <!-- Lower Large Outer Wing (Navy Blue #004d7a) -->
    <path
      class="navy-petal"
      d="M 18 554
         C 90 538, 186 532, 268 538
         C 272 596, 272 654, 268 706
         C 186 682, 94 628, 18 554 Z"
    />

    <!-- Bottom Base Oval Petal (Navy Blue #004d7a) -->
    <path
      class="navy-petal"
      d="M 186 756
         C 248 708, 384 712, 486 756
         C 418 834, 282 846, 186 756 Z"
    />

    <!-- Bottom Stem Slash (Navy Blue #004d7a) -->
    <polygon
      class="navy-petal"
      points="488,776 468,776 412,882 436,882"
    />
  </g>

  <!-- ============================================================ -->
  <!-- 3. RIGHT HALF PETALS (Symmetrical Reflection)                -->
  <!-- ============================================================ -->
  <use href="#left-petals" transform="matrix(-1 0 0 1 1000 0)" />

</svg>
